# fly.toml app configuration file generated for rolezinho on 2026-07-13T17:37:39-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rolezinho'
primary_region = 'gru'
kill_signal = 'SIGTERM'

[build]
[env]
  PHX_HOST = 'rolezinho.lubien.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
